<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark website background (#0f131d) -->
  <rect width="512" height="512" fill="#0f131d"/>

  <!-- Tactical Badge Container: rounded-lg with bg-cyan-500/20 and border-cyan-500/40 -->
  <!-- Ratio: 384x384 box centered at (256, 256), radius 96 (matching rounded-lg 25% ratio) -->
  <rect x="64" y="64" width="384" height="384" rx="96" ry="96" 
        fill="#082332" 
        stroke="#06b6d4" 
        stroke-opacity="0.55" 
        stroke-width="14"/>

  <!-- Exact Lucide Satellite Icon (viewBox 0 0 24 24, stroke-width 2, centered and scaled to 200x200) -->
  <!-- Center is 256, 256. Scale factor is 8.5. Offset is 256 - 12*8.5 = 154 -->
  <g transform="translate(154, 154) scale(8.5)" 
     fill="none" 
     stroke="#22d3ee" 
     stroke-width="2" 
     stroke-linecap="round" 
     stroke-linejoin="round">
    <path d="M13 7 9 3 5 7l4 4"/>
    <path d="m17 11 4 4-4 4-4-4"/>
    <path d="m8 12 4 4 6-6-4-4Z"/>
    <path d="m16 8 3-3"/>
    <path d="M9 21a6 6 0 0 0-6-6"/>
  </g>
</svg>
