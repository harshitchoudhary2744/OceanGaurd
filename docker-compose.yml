services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: oceanguard-postgis
    restart: always
    environment:
      POSTGRES_USER: oceanguard
      POSTGRES_PASSWORD: oceanguard123
      POSTGRES_DB: oceanguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./apps/api/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanguard -d oceanguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: oceanguard-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgis_data:
  qdrant_storage:
